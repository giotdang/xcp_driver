# xcptool configuration file

# xcptool — cấu hình bus. File này do công cụ ghi, sửa tay được.
[bus]
backend = "virtual"
channel = "xcptool"
bitrate = 500000
cro_id = 0x7E0
dto_id = 0x7E1
extended_id = false
pad_dlc = true
t1_timeout_s = 1.0
is_fd = true
data_bitrate = 2000000
custom_bit_timing = true
f_clock = 80000000
brp = 1
tseg1 = 14
tseg2 = 2
sjw = 1
dbrp = 1
dtseg1 = 14
dtseg2 = 2
dsjw = 1

[session]
last_a2l_path = "G:/@Autosar/xcp/xcp_driver/examples/xcp_daq_example.a2l"

[ui]
scope_enabled = false
trace_row_limit = 20000
active_route = "measurement"
dock_state = ""
debug_area_collapsed = true
trace_visible_kinds = ["cmd", "res", "err", "ev", "serv", "other"]
