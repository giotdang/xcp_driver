[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcptool"
version = "0.1.0"
description = "Công cụ XCP master đa nền tảng — đo lường và hiệu chỉnh ECU qua CAN"
requires-python = ">=3.11"
dependencies = [
    "python-can>=4.3",
    "PySide6>=6.6",
    "PySide6-Fluent-Widgets>=1.11",
    "pyqtgraph>=0.13",
]

# asammdf (MDF4) để tới mốc sau, chưa cần cho M1/M2–M4.
# PySide6-Fluent-Widgets: dual license (GPLv3 non-commercial / thương mại cần mua) —
# xem DESIGN.md QĐ5. Xác nhận điều khoản trước khi đóng gói bản phân phối ra ngoài.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
]
# Backend slcan/CANable cần pyserial, không thì python-can báo
# "You won't be able to use the slcan can backend without the serial module".
# Để tuỳ chọn cho bản cài mặc định gọn.
slcan = ["pyserial>=3.5"]

[project.scripts]
xcptool = "xcptool.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Không test nào được treo. Test treo trong app đa luồng = bug thật, không phải
# máy chậm.
timeout = 60
